<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>

    <script>
        // 192x192 icon
        const canvas192 = document.getElementById('canvas192');
        const ctx192 = canvas192.getContext('2d');
        ctx192.fillStyle = '#1a1a2e';
        ctx192.fillRect(0, 0, 192, 192);
        ctx192.font = 'bold 120px Arial';
        ctx192.fillStyle = 'white';
        ctx192.textAlign = 'center';
        ctx192.textBaseline = 'middle';
        ctx192.fillText('🅿️', 96, 96);

        // 512x512 icon
        const canvas512 = document.getElementById('canvas512');
        const ctx512 = canvas512.getContext('2d');
        ctx512.fillStyle = '#1a1a2e';
        ctx512.fillRect(0, 0, 512, 512);
        ctx512.font = 'bold 320px Arial';
        ctx512.fillStyle = 'white';
        ctx512.textAlign = 'center';
        ctx512.textBaseline = 'middle';
        ctx512.fillText('🅿️', 256, 256);

        // Download links
        setTimeout(() => {
            canvas192.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'logo192.png';
                a.click();
            });

            canvas512.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'logo512.png';
                a.click();
            });

            alert('Icons downloaded! Place them in public/ folder');
        }, 500);
    </script>
</body>
</html>
